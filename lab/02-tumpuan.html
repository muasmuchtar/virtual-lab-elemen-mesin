 let zero=Array(n+3).fill(0),rhs=eq(zero),mat=Array.from({length:n+3},()=>[]);for(let j=0;j<n+3;j++){let z=zero.slice();z[j]=1;eq(z).forEach((v,i)=>mat[i][j]=v-rhs[i])}let z;try{z=solve(mat,rhs.map(v=>-v))}catch(e){return {...base,stable:false,numerical:true}}

function runSelfChecks(){let out=[],test=(id,en,fn)=>{try{fn();out.push({id,en,ok:true})}catch(e){out.push({id,en,ok:false,error:e.message})}},near=(a,b,eps=1e-6)=>{if(!Number.isFinite(a)||Math.abs(a-b)>eps*Math.max(1,Math.abs(b)))throw Error(a+' ≠ '+b)},assert=v=>{if(!v)throw Error('assertion failed')},calc=v=>Engine.calculate({...defaults,...v});
 test('Crane awal: RAy = 20, RBy = 10 kN; Mmax = 40 kN·m','Initial crane: RAy = 20, RBy = 10 kN; Mmax = 40 kN·m',()=>{let r=calc({});near(r.a.Ay,20);near(r.a.By,10);near(r.Mmax,40);assert(r.equilibrium)});
 test('Beban tengah: δ = PL³/(48EI)','Midspan point load: δ = PL³/(48EI)',()=>{let r=calc({x:3});near(r.dmax,30*6**3/(48*r.EI)*1000);near(r.at(0).v,0);near(r.at(6).v,0)});
 test('Kantilever: momen dan defleksi ujung','Cantilever: moment and tip deflection',()=>{let r=calc({A:'fixed',B:'none',x:6});near(r.a.MA,180);near(r.Mmax,180);near(r.at(6).v,-30*6**3/(3*r.EI));near(r.at(0).t,0)});
 test('Beban merata sendi–rol: wL²/8 dan 5wL⁴/(384EI)','Pin–roller UDL: wL²/8 and 5wL⁴/(384EI)',()=>{let r=calc({type:'udl',w:5});near(r.a.Ay,15);near(r.Mmax,5*36/8);near(r.dmax,5*5*6**4/(384*r.EI)*1000)});

 test('Jepit–jepit: kompatibilitas & momen ujung','Fixed–fixed: compatibility & end moments',()=>{let r=calc({A:'fixed',B:'fixed',type:'udl',w:5});assert(r.degree===3);near(r.a.MA,15);near(r.a.MB,-15);near(r.at(6).v,0);near(r.at(6).t,0);near(r.dmax,5*6**4/(384*r.EI)*1000)});
 test('Kantilever disangga: RBy = 3wL/8','Propped cantilever: RBy = 3wL/8',()=>{let r=calc({A:'fixed',B:'pin',type:'udl',w:5});assert(r.degree===2);near(r.a.By,3*5*6/8);near(r.at(6).v,0);assert(r.equilibrium)});
 test('Dua rol: mekanisme translasi horizontal','Two rollers: horizontal translation mechanism',()=>{let r=calc({A:'roller',B:'roller'});assert(!r.stable);assert(!r.a)});

 test('Satu sendi: mekanisme rotasi','One pin: rotational mechanism',()=>assert(!calc({B:'none'}).stable));
 test('Dua sendi: statis tak tentu tingkat 1','Two pins: indeterminate degree one',()=>{let r=calc({B:'pin',axial:10,x:2});assert(r.degree===1);near(r.a.Ax,-10*4/6);near(r.a.Bx,-10*2/6);assert(r.equilibrium)});
 test('Rol miring: reaksi sepanjang normal','Inclined roller: reaction along normal',()=>{let r=calc({angleB:60});near(r.a.Bx/r.a.By,1/Math.sqrt(3));assert(r.equilibrium)});
 test('Link: reaksi sumbu; link horizontal + sendi tidak stabil','Link: axial reaction; horizontal link + pin unstable',()=>{let r=calc({B:'link',angleB:45});near(r.a.Bx,r.a.By);assert(!calc({B:'link',angleB:0}).stable)});
 test('Guide–sendi: gerak normal dan rotasi ditahan','Guide–pin: normal displacement and rotation restrained',()=>{let r=calc({A:'guide',B:'pin'});near(r.at(0).v,0);near(r.at(0).t,0);near(r.at(6).v,0);assert(r.equilibrium)});
 test('Gaya miring dan keseimbangan aksial','Inclined force and axial equilibrium',()=>{let r=calc({type:'inclined',theta:30});near(r.a.Ax,-30*Math.cos(Math.PI/6));near(r.a.Ay+r.a.By,15)});
 test('Robot β = 60°: momen gravitasi PL cos β','Robot β = 60°: gravity moment PL cos β',()=>{let r=calc({A:'fixed',B:'none',x:6,beta:60});near(r.a.MA,90);assert(r.equilibrium)});
 test('Superposisi dua beban dan beban merata','Two point loads and UDL superposition',()=>{let r=calc({type:'multiple',P2:10,x2:4,addUDL:true,w:2});near(r.a.Ay+r.a.By,52);near(r.a.By*6,30*2+10*4+2*6*3);assert(r.equilibrium)});
 test('Momen terpusat: loncatan BMD = −C','Applied couple: BMD jump = −C',()=>{let r=calc({P:0,couple:12,cx:3});near(r.at(3,'right').M-r.at(3,'left').M,-12);near(r.a.By,-2);near(r.a.Ay,2)});
 test('Identitas dM/dx = V dan EI v″ = M','Identities dM/dx = V and EI v″ = M',()=>{let r=calc({addUDL:true,w:3}),x=4,h=.0001;near((r.at(x+h).M-r.at(x-h).M)/(2*h),r.at(x).V);near(r.EI*(r.at(x+h).v-2*r.at(x).v+r.at(x-h).v)/(h*h),r.at(x).M,1e-4)});
 test('Beban pada ujung: reaksi dan diagram batas','Endpoint loads: reactions and boundary diagrams',()=>{let a=calc({x:0}),b=calc({x:6});near(a.a.Ay,30);near(a.Mmax,0);near(b.a.By,30);near(b.Mmax,0)});
 test('Tanpa beban: nilai nol, tanpa NaN','Zero load: zero values without NaN',()=>{let r=calc({P:0,P2:0});near(r.Mmax,0);near(r.dmax,0);assert(r.fos===null);assert(r.equilibrium)});
 test('Berat sendiri memakai ρgA','Self-weight uses ρgA',()=>{let r=calc({P:0,selfWeight:true});near(r.a.Ay+r.a.By,7850*9.80665*.006*6/1000)});

 return out;}
